<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tribuna VET</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,500..900;1,62..125,500..900&family=Inter:wght@400;500;600;700&family=Rubik:wght@400;500;600;700;800;900&display=swap">
<style>
/* Night-match look: black/graphite surfaces, neon green accent, condensed italic display type, full-bleed stadium heroes, FUT-style player cards. Always dark by design. */
:root {
  --bg: #07090a; --bg-2: #0c0f10; --surface: #111516; --surface-2: #192022; --surface-3: #232b2d; --line: #222a2c;
  --ink: #f3f6f4; --muted: #8b9792; --accent: #39ff5a; --accent-2: #b8ff3b; --accent-ink: #03140a; --accent-soft: rgba(57,255,90,.12);
  --win: #39ff5a; --draw: #66716d; --loss: #ff4d5e;
  --glow: 0 0 0 1px rgba(57,255,90,.4), 0 0 26px rgba(57,255,90,.28);
  --f-display: "Archivo", "Rubik", system-ui, sans-serif; --f-body: "Inter", "Rubik", system-ui, sans-serif;
  --d-style: italic; --d-stretch: 76%; --r: 16px; color-scheme: dark;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { color-scheme: dark; } }
:root[data-theme="dark"] { color-scheme: dark; }

html, body { overflow-x: clip; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
.wrap { max-width: 1320px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); box-sizing: border-box; }
a { color: inherit; text-decoration: none; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
svg { width: 1em; height: 1em; }
[hidden] { display: none !important; }
.disp, h1, h2, h3 { font-family: var(--f-display); font-style: var(--d-style); font-stretch: var(--d-stretch); font-weight: 900; text-transform: uppercase; letter-spacing: -.005em; line-height: .95; margin: 0; overflow-wrap: anywhere; text-wrap: balance; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.green { color: var(--accent); }

/* Header */
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: rgba(7,9,10,.82); backdrop-filter: blur(16px) saturate(1.4); -webkit-backdrop-filter: blur(16px) saturate(1.4); border-bottom: 1px solid var(--line); }
.top-row { display: flex; align-items: center; gap: 16px; padding-block: 10px; }
.brand { display: flex; align-items: center; gap: 10px; }
.brand-mark { width: 38px; height: 38px; border-radius: 11px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; box-shadow: var(--glow); }
.brand-mark svg { width: 24px; height: 24px; }
.brand b { display: block; font-family: "Archivo", sans-serif; font-style: italic; font-weight: 900; font-stretch: 80%; font-size: 24px; line-height: .9; letter-spacing: .01em; }
.brand small { display: block; font-size: 10px; color: var(--accent); font-weight: 700; letter-spacing: .16em; text-transform: uppercase; margin-top: 3px; }
.top nav { display: flex; gap: 4px; margin-inline-start: auto; align-items: center; }
.top nav a { padding: 8px 12px; font-weight: 700; font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); position: relative; }
.top nav a:hover, .top nav a.on { color: var(--ink); }
.top nav a.on::after { content: ""; position: absolute; inset: auto 12px 0; height: 2px; border-radius: 2px; background: var(--accent); box-shadow: 0 0 10px var(--accent); }
.top nav a.cta { background: var(--accent); color: var(--accent-ink); border-radius: 10px; margin-inline-start: 6px; }
.top nav a.cta::after { display: none; }
.badge { display: inline-grid; place-items: center; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--accent); color: var(--accent-ink); font-size: 11px; font-weight: 800; margin-inline-start: 6px; }
.lang { display: flex; padding: 3px; background: var(--surface-2); border-radius: 10px; margin-inline-start: 8px; }
.lang button { border: 0; background: none; border-radius: 7px; padding: 4px 10px; cursor: pointer; font-size: 12px; font-weight: 800; color: var(--muted); }
.lang button[aria-pressed="true"] { background: var(--surface-3); color: var(--ink); }
.groups { display: flex; gap: 6px; overflow-x: auto; padding-block: 0 10px; scrollbar-width: none; }
.groups::-webkit-scrollbar { display: none; }
.groups a { flex: none; font-family: "Archivo", sans-serif; font-style: italic; font-stretch: 85%; font-weight: 800; font-size: 14px; padding: 5px 14px; border-radius: 8px; background: var(--surface); border: 1px solid var(--line); color: var(--muted); }
.groups a:hover { color: var(--ink); border-color: var(--surface-3); }
.groups a.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

main { padding-block: 0 72px; display: grid; gap: 36px; }
@media (prefers-reduced-motion: no-preference) { main.enter > * { animation: rise .4s ease both; } @keyframes rise { from { opacity: .001; transform: translateY(10px); } } }
section { display: grid; gap: 14px; min-width: 0; }
.sec-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.sec-head h2 { font-size: clamp(24px, 3.4vw, 32px); display: flex; align-items: center; gap: 10px; }
.sec-head h2::before { content: ""; width: 6px; height: .9em; background: var(--accent); border-radius: 2px; transform: skewX(-12deg); box-shadow: 0 0 12px var(--accent); }
.sec-head a { font-size: 13px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); }

/* Hero (full bleed) */
.hero { position: relative; margin-inline: calc(50% - 50vw); min-height: clamp(440px, 64vh, 620px); display: grid; align-content: end; overflow: hidden; isolation: isolate; border-bottom: 1px solid var(--line); }
.hero.compact { min-height: clamp(300px, 40vh, 400px); }
.hero .art { position: absolute; inset: 0; z-index: -2; }
.hero .art svg, .hero .art img { width: 100%; height: 100%; object-fit: cover; display: block; }
html[dir="rtl"] .hero .art svg { transform: scaleX(-1); }
.hero .shade { position: absolute; inset: 0; z-index: -1; background: linear-gradient(90deg, rgba(7,9,10,.92) 0%, rgba(7,9,10,.55) 45%, rgba(7,9,10,.05) 75%), linear-gradient(0deg, var(--bg) 0%, rgba(7,9,10,0) 45%); }
html[dir="rtl"] .hero .shade { background: linear-gradient(270deg, rgba(7,9,10,.92) 0%, rgba(7,9,10,.55) 45%, rgba(7,9,10,.05) 75%), linear-gradient(0deg, var(--bg) 0%, rgba(7,9,10,0) 45%); }
.hero-in { width: 100%; max-width: 1200px; margin: 0 auto; box-sizing: border-box; padding: 48px max(16px, env(safe-area-inset-right, 0px)) 28px max(16px, env(safe-area-inset-left, 0px)); display: grid; gap: 18px; justify-items: start; }
.tag { display: inline-flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); }
.tag::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 10px var(--accent); }
.hero h1 { font-size: clamp(46px, 9vw, 112px); max-width: 12ch; text-shadow: 0 4px 30px rgba(0,0,0,.5); }
.hero h1 .l2 { display: block; color: var(--accent); text-shadow: 0 0 34px rgba(57,255,90,.45); }
.hero.compact h1 { font-size: clamp(36px, 6.6vw, 76px); max-width: 18ch; }
.hero p.lead { margin: 0; max-width: 52ch; font-size: clamp(15px, 1.6vw, 18px); color: #c8d2cd; font-weight: 500; }
.ctas { display: flex; gap: 10px; flex-wrap: wrap; }
.kpis { display: flex; gap: 0; flex-wrap: wrap; border: 1px solid rgba(255,255,255,.1); border-radius: 14px; background: rgba(10,13,14,.6); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); overflow: hidden; }
.kpi { padding: 10px 18px; display: grid; border-inline-end: 1px solid rgba(255,255,255,.08); min-width: 84px; }
.kpi:last-child { border-inline-end: 0; }
.kpi b { font-family: var(--f-display); font-style: var(--d-style); font-stretch: var(--d-stretch); font-weight: 900; font-size: 30px; line-height: 1.05; color: var(--accent); font-variant-numeric: tabular-nums; }
.kpi span { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.search { position: relative; width: min(440px, 100%); }
.search input { width: 100%; box-sizing: border-box; padding: 13px 16px 13px 44px; border-radius: 12px; border: 1px solid rgba(255,255,255,.14); background: rgba(10,13,14,.7); color: var(--ink); }
.search input:focus { outline: none; border-color: var(--accent); box-shadow: var(--glow); }
html[dir="rtl"] .search input { padding: 13px 44px 13px 16px; }
.search input::placeholder { color: var(--muted); }
.search svg { position: absolute; inset-inline-start: 15px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: var(--muted); }
.hits { display: flex; flex-wrap: wrap; gap: 6px; }
.hits:empty { display: none; }
.hits a { display: flex; align-items: center; gap: 8px; padding: 5px 12px 5px 5px; background: rgba(17,21,22,.85); border: 1px solid var(--line); border-radius: 999px; font-size: 14px; font-weight: 600; }
html[dir="rtl"] .hits a { padding: 5px 5px 5px 12px; }
.hits a:hover { border-color: var(--accent); }

/* Crests */
.crest { --s: 28px; width: var(--s); height: var(--s); border-radius: 50%; flex: none; object-fit: cover; display: inline-grid; place-items: center; color: #fff; font-weight: 800; font-size: calc(var(--s) * .38); font-family: "Archivo", sans-serif; font-style: normal; letter-spacing: -.02em; background: var(--surface-2); box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.18); }
.crest.sm { --s: 22px; } .crest.lg { --s: 40px; } .crest.xl { --s: 120px; box-shadow: 0 0 0 3px var(--accent), 0 0 40px rgba(57,255,90,.35); }

/* Cards / dashboard */
.dash { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr) minmax(0, 1fr); gap: 16px; align-items: stretch; }
@media (max-width: 1040px) { .dash { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } .dash > :first-child { grid-column: 1 / -1; } }
@media (max-width: 680px) { .dash { grid-template-columns: minmax(0, 1fr); } }
.card { background: linear-gradient(180deg, var(--surface), var(--bg-2)); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: grid; gap: 12px; align-content: start; min-width: 0; }
.card-h { display: flex; align-items: center; gap: 10px; justify-content: space-between; }
.card-h h3 { font-size: 20px; display: flex; align-items: center; gap: 8px; }
.card-h h3 svg { color: var(--accent); width: 18px; height: 18px; }
.card-h a { font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); }
.card .tbl { border: 0; background: none; }
.card table th, .card table td { padding: 8px 6px; }
.crow { display: grid; grid-template-columns: minmax(0, 1fr) 58px minmax(0, 1fr); gap: 8px; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 14px; font-weight: 600; }
.crow:last-child { border-bottom: 0; }
.crow .t { display: flex; align-items: center; gap: 8px; min-width: 0; }
.crow .t span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.crow .t.h { justify-content: flex-end; text-align: end; }
.crow .t:hover { color: var(--accent); }
.crow .sc { width: 58px; font-size: 16px; }

/* Highlight */
.hl { position: relative; display: grid; place-items: center; aspect-ratio: 16/10; border-radius: 12px; overflow: hidden; background: #000; color: #fff; }
.hl img, .hl video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.hl .art { position: absolute; inset: 0; opacity: .7; }
.hl .art svg { width: 100%; height: 100%; }
.hl .cap { position: absolute; inset: auto 0 0; padding: 30px 12px 10px; background: linear-gradient(0deg, rgba(0,0,0,.85), transparent); font-weight: 700; font-size: 14px; }
.play { position: relative; width: 64px; height: 64px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; box-shadow: 0 0 0 8px rgba(57,255,90,.18), 0 0 40px rgba(57,255,90,.5); }
.play svg { width: 24px; height: 24px; margin-inline-start: 3px; }

/* Player cards (FUT style) */
.pcards { display: grid; grid-auto-flow: column; grid-auto-columns: 176px; gap: 14px; overflow-x: auto; padding: 6px 2px 14px; scroll-snap-type: x mandatory; scrollbar-width: thin; scrollbar-color: var(--surface-3) transparent; }
.pcard { --c1: #1a2a1f; --c2: #0b120d; --c3: #39ff5a; --ink-c: #f3f6f4; scroll-snap-align: start; position: relative; aspect-ratio: 5/7; padding: 3px; clip-path: polygon(14% 0, 86% 0, 100% 7%, 100% 87%, 50% 100%, 0 87%, 0 7%); background: linear-gradient(160deg, var(--c3), rgba(255,255,255,.15) 45%, var(--c3)); transition: transform .25s ease; }
.pcard:hover { transform: translateY(-4px); }
.pcard .in { height: 100%; box-sizing: border-box; clip-path: inherit; background: radial-gradient(120% 70% at 50% 30%, var(--c1), var(--c2)); color: var(--ink-c); display: grid; grid-template-rows: auto 1fr auto auto; padding: 14px 12px 22px; position: relative; overflow: hidden; }
.pcard .in::before { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(115deg, rgba(255,255,255,.05) 0 2px, transparent 2px 14px); pointer-events: none; }
.pc-top { display: grid; justify-items: center; gap: 2px; position: absolute; top: 16px; inset-inline-start: 12px; z-index: 1; }
.pc-num { font-family: "Archivo", sans-serif; font-style: italic; font-weight: 900; font-stretch: 80%; font-size: 40px; line-height: .85; }
.pc-lbl { font-size: 10px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; opacity: .85; }
.pc-top .crest { margin-top: 6px; }
.pc-rank { position: absolute; top: 16px; inset-inline-end: 14px; font-family: "Archivo", sans-serif; font-style: italic; font-weight: 900; font-size: 15px; opacity: .8; }
.pc-face { grid-row: 2; display: grid; place-items: end center; padding-top: 18px; }
.pc-face svg { width: 74%; height: auto; aspect-ratio: 1; color: var(--ink-c); opacity: .22; filter: drop-shadow(0 6px 10px rgba(0,0,0,.4)); }
.pc-name { grid-row: 3; text-align: center; font-family: var(--f-display); font-style: var(--d-style); font-stretch: var(--d-stretch); font-weight: 900; text-transform: uppercase; font-size: 17px; line-height: 1; padding-block: 8px 6px; border-bottom: 1px solid color-mix(in srgb, var(--ink-c) 30%, transparent); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.pc-team { grid-row: 4; text-align: center; font-size: 11px; font-weight: 700; padding-top: 6px; opacity: .85; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pcard.gold { --c1: #f7e49a; --c2: #b98a26; --c3: #ffe68a; --ink-c: #2a1d04; }
.pcard.silver { --c1: #eef2f4; --c2: #8e9aa1; --c3: #f5f8fa; --ink-c: #182024; }
.pcard.bronze { --c1: #e8a776; --c2: #8a4a22; --c3: #f2b98d; --ink-c: #2a1206; }
.pcard.gold .pc-face svg, .pcard.silver .pc-face svg, .pcard.bronze .pc-face svg { opacity: .3; }
.pcard.neon .in { box-shadow: inset 0 0 40px rgba(57,255,90,.12); }
.pcard.neon .pc-num { color: var(--accent); }
.kingrow { display: grid; grid-template-columns: 230px minmax(0, 1fr); gap: 20px; align-items: center; }
.kingrow .pcard { width: 100%; }
.kingrow .pc-num { font-size: 54px; }
.kingrow .pc-name { font-size: 22px; }
@media (max-width: 640px) { .kingrow { grid-template-columns: minmax(0, 1fr); } .kingrow > .pcard { width: 210px; justify-self: center; } }

/* Match cards (rail) */
.rail { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(250px, 1fr); gap: 14px; overflow-x: auto; padding-bottom: 8px; scroll-snap-type: x mandatory; scrollbar-width: thin; scrollbar-color: var(--surface-3) transparent; }
.mcard { scroll-snap-align: start; background: linear-gradient(180deg, var(--surface), var(--bg-2)); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; display: grid; gap: 10px; }
.mcard:hover { border-color: rgba(57,255,90,.4); }
.mcard .mtop { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border-radius: 6px; background: var(--surface-2); font-size: 11px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
.chip.hot { background: var(--accent); color: var(--accent-ink); }
.mcard .side { display: flex; align-items: center; gap: 10px; font-weight: 700; min-width: 0; }
.mcard .side a { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mcard .side a:hover { color: var(--accent); }
.mcard .when { font-family: "Archivo", sans-serif; font-style: italic; font-weight: 900; font-stretch: 85%; font-size: 26px; color: var(--accent); line-height: 1; }

/* Results list */
.list { background: var(--surface); border-radius: var(--r); border: 1px solid var(--line); overflow: hidden; }
.mrow { display: grid; grid-template-columns: 92px minmax(0, 1fr) 74px minmax(0, 1fr); gap: 12px; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.mrow:last-child { border-bottom: 0; }
.mrow:hover { background: var(--surface-2); }
.mrow .when { font-size: 12px; color: var(--muted); line-height: 1.3; font-variant-numeric: tabular-nums; }
.mrow .t { display: flex; align-items: center; gap: 10px; min-width: 0; font-weight: 500; }
.mrow .t.h { justify-content: flex-end; text-align: end; }
.mrow .t a { overflow-wrap: anywhere; }
.mrow .t a:hover { color: var(--accent); }
.mrow .t.won { font-weight: 800; }
.mrow .t.lost { color: var(--muted); }
.sc { justify-self: center; font-family: "Archivo", sans-serif; font-style: italic; font-weight: 900; font-stretch: 90%; font-size: 18px; padding: 5px 0; width: 70px; text-align: center; border-radius: 8px; background: var(--bg); border: 1px solid var(--surface-3); font-variant-numeric: tabular-nums; }
.sc.up { font-family: var(--f-body); font-style: normal; font-weight: 600; font-size: 13px; color: var(--muted); }
.sc.res-W { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.sc.res-L { background: color-mix(in srgb, var(--loss) 20%, transparent); border-color: color-mix(in srgb, var(--loss) 50%, transparent); color: var(--loss); }
.mrow .grp { grid-column: 2 / -1; margin-top: -6px; }
@media (max-width: 560px) {
  .mrow { grid-template-columns: minmax(0, 1fr) 62px minmax(0, 1fr); gap: 8px; padding: 12px; }
  .mrow .when { grid-column: 1 / -1; }
  .mrow .grp { grid-column: 1 / -1; margin-top: 0; }
  .mrow .t .crest { display: none; }
  .sc { width: 60px; }
}

/* Standings */
.tbl { background: var(--surface); border-radius: var(--r); border: 1px solid var(--line); overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
th, td { padding: 11px 10px; text-align: start; white-space: nowrap; }
thead th { font-size: 11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); border-bottom: 1px solid var(--line); }
tbody tr { border-bottom: 1px solid var(--line); }
tbody tr:last-child { border-bottom: 0; }
tbody tr:hover { background: var(--surface-2); }
td.c, th.c { text-align: center; }
td.rank { width: 34px; position: relative; font-weight: 800; color: var(--muted); text-align: center; }
tr.q td.rank { color: var(--accent); }
tr.q td.rank::before { content: ""; position: absolute; inset-inline-start: 0; top: 8px; bottom: 8px; width: 3px; border-radius: 3px; background: var(--accent); box-shadow: 0 0 8px var(--accent); }
td.team a { display: flex; align-items: center; gap: 10px; font-weight: 700; }
td.team a span { overflow: hidden; text-overflow: ellipsis; max-width: 26ch; }
td.team a:hover { color: var(--accent); }
td.pts { font-family: "Archivo", sans-serif; font-style: italic; font-weight: 900; font-size: 18px; color: var(--accent); }
tr.me { background: var(--accent-soft) !important; }
.dots { display: inline-flex; gap: 3px; vertical-align: middle; }
.dots i { width: 8px; height: 8px; border-radius: 2px; background: var(--draw); }
.dots i.W { background: var(--win); box-shadow: 0 0 6px rgba(57,255,90,.6); } .dots i.L { background: var(--loss); }
@media (max-width: 560px) { .hide-sm { display: none; } td.team a span { max-width: 16ch; } }

.cols { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 24px; align-items: start; }
@media (max-width: 900px) { .cols { grid-template-columns: minmax(0, 1fr); } }

.seg { display: inline-flex; padding: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; gap: 2px; flex-wrap: wrap; justify-self: start; max-width: 100%; }
.seg button { border: 0; background: none; padding: 8px 16px; border-radius: 9px; cursor: pointer; font-weight: 800; font-size: 13px; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }

/* Posts */
.feed { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 16px; }

.post { background: var(--surface); border-radius: var(--r); overflow: hidden; border: 1px solid var(--line); display: grid; grid-template-rows: auto 1fr; min-width: 0; }

.post h3 { font-size: 22px; }
.post p { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; color: var(--muted); }
.empty { border: 1.5px dashed var(--surface-3); border-radius: var(--r); padding: 28px; color: var(--muted); display: grid; gap: 14px; justify-items: start; background: var(--surface); }

.btn { display: inline-flex; align-items: center; gap: 8px; border: 0; background: var(--accent); color: var(--accent-ink); font-weight: 900; letter-spacing: .05em; text-transform: uppercase; padding: 13px 20px; border-radius: 10px; cursor: pointer; font-size: 13px; box-shadow: 0 0 24px rgba(57,255,90,.3); }

/* Form */

/* Captains' upload call-to-action */
.captain { grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 22px; padding: clamp(18px, 3vw, 28px); border-radius: 22px;
  background: linear-gradient(110deg, var(--accent) 0 6px, transparent 6px), linear-gradient(120deg, #13221a, var(--surface) 60%); border: 1px solid rgba(57,255,90,.3); }

@media (max-width: 860px) { .captain { grid-template-columns: auto minmax(0, 1fr); } .cap-acts { grid-column: 1 / -1; grid-template-columns: 1fr 1fr; } .cap-acts .btn { justify-content: center; } }
@media (max-width: 560px) { .captain { grid-template-columns: minmax(0, 1fr); } .cap-ic { width: 60px; height: 60px; } .cap-acts { grid-template-columns: minmax(0, 1fr); } }

/* Home: main column + fixed Goal-of-the-Week column on the right */
.homegrid { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 24px; align-items: start; margin-top: 20px; }

.homemain { display: grid; gap: 36px; min-width: 0; }
.gside { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 112px); max-height: calc(100vh - 128px); overflow-y: auto; overscroll-behavior: contain; scrollbar-width: thin; scrollbar-color: var(--surface-3) transparent;
  display: grid; gap: 14px; align-content: start; padding: 18px; border-radius: 22px; border: 1px solid rgba(57,255,90,.3);
  background: radial-gradient(120% 60% at 100% 0%, rgba(57,255,90,.16), transparent 60%), linear-gradient(180deg, #0d1510, var(--bg-2)); }
.gside-head { display: grid; gap: 6px; }

@media (max-width: 1100px) {

/* Highlights + statistics */

.cols table { font-size: 13px; }
.cols th, .cols td { padding: 5px 7px; }
.cols thead th { font-size: 10px; }
.cols td.team a { gap: 8px; }
.cols td.team a .crest { --s: 22px; }
.cols td.pts { font-size: 16px; }
.cols .mrow { font-size: 13px; padding: 6px 12px; gap: 10px; }
.cols .mrow .when { font-size: 11px; }
.cols .mrow .t { gap: 8px; }
.cols .mrow .crest { --s: 22px; }
.cols .sc { font-size: 15px; width: 60px; padding: 3px 0; }

/* Phones: player list as compact one-line rows (photo, name, then position and numbers) instead of tall cards. */
@media (max-width: 600px) {
  .roster { grid-template-columns: minmax(0, 1fr); gap: 6px; }
  .rcard { grid-template-columns: 44px minmax(0, 1fr); gap: 10px; padding: 6px 10px 6px 6px; border-radius: 12px; align-items: center; }
  .rphoto { width: 44px; height: 44px; border-radius: 10px; }
  .rphoto > svg { width: 38px; height: 38px; }
  .rnum { top: 2px; inset-inline-start: 2px; min-width: 18px; height: 18px; font-size: 11px; border-radius: 5px; }
  .rinfo { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 8px; }
  .rtop { flex: 0 0 100%; }
  .rname { font-size: 15px; }
  .rinfo .chip { font-size: 10px; padding: 2px 7px; }
  .rmeta { display: flex; gap: 10px; margin-inline-start: auto; }
  .rmeta span { display: flex; align-items: baseline; gap: 4px; }
  .rmeta small { font-size: 9px; }
  .rmeta b { font-size: 13px; }
}

/* Compact density on desktop: smaller hero, tighter sections, denser lists, so less scrolling. */
@media (min-width: 900px) {
  /* League names row under the header: a bit smaller on desktop (phones keep the original size). */
  .groups { gap: 4px; padding-block: 2px 8px; }
  .groups a { font-size: 11px; padding: 3px 8px; border-radius: 6px; }
  main { gap: 22px; padding-block: 0 48px; }
  section { gap: 10px; }
  .sec-head h2 { font-size: clamp(20px, 2vw, 26px); }
  .hero { min-height: clamp(320px, 46vh, 440px); }
  .hero.inhome { min-height: clamp(340px, 46vh, 440px); }
  .hero.compact { min-height: 0; }
  .hero-in { padding-block: 32px 20px; gap: 12px; }
  .hero.compact .hero-in { padding-block: 22px 16px; gap: 10px; }
  .hero h1 { font-size: clamp(40px, 6vw, 80px); }
  .hero.inhome h1 { font-size: clamp(38px, 5vw, 68px); }
  .hero.compact h1 { font-size: clamp(28px, 3.4vw, 46px); }
  .crest.xl { --s: 84px; }
  .tb-row { gap: 18px; }
  .kpi { padding: 6px 14px; min-width: 70px; }
  .kpi b { font-size: 22px; }
  .roster { grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 8px; }
  .rcard { grid-template-columns: 58px minmax(0, 1fr); gap: 10px; padding: 8px; border-radius: 12px; }
  .rphoto { width: 58px; height: 58px; border-radius: 10px; }
  .rphoto > svg { width: 48px; height: 48px; }

  .rname { font-size: 14px; }
  .rmeta { gap: 10px; }
  .rmeta b { font-size: 13px; }
  .pcards { grid-auto-columns: 160px; gap: 10px; padding-bottom: 8px; }
  .feed { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
  .post .media { aspect-ratio: 16/10; }
  .feed.big > :first-child .media { aspect-ratio: 16/9; }
  .post .body { padding: 10px 12px 12px; }
  .post h3 { font-size: 18px; }
  th, td { padding: 7px 8px; }
  .mrow { padding: 8px 14px; }
  .crow { padding: 6px 0; }

  fetch("data/positions.json", { cache: "no-store" }).then(r => r.ok ? r.json() : null).then(j => { if (j) { S.positions = j; render(); } }).catch(() => {});

  await S.db.doc("teamcodes/" + teamKey).set({ s: salt, h: hsh, i: iter, k: (await sha256hex(code)).slice(0, 3), updatedAt: Date.now() });
}
async function genOne(teamKey) {
  if (genBusy) return; genBusy = teamKey; render();
  try { await genCode(teamKey); } catch (e) {}
  genBusy = null; render();
}
async function genMissing(L) {
  if (genBusy) return;
  const todo = L.groups.flatMap(g => g.table.map(r => r.slug)).filter(k => !S.codesPlain[k]);
  genBusy = "all"; let n = 0;
  for (const k of todo) { try { await genCode(k); } catch (e) {} n++; const b = $("#genAllBtn"); if (b) b.textContent = t("generating") + " " + n + "/" + todo.length; }
  genBusy = null; render();
}
// Admin: remove a coach's own password so the team goes back to the default 12345.
async function resetClaim(team) {
  const c = S.claims[team]; if (!c || !confirm(t("resetConfirm"))) return;
  const tm = { ...(S.claimDocs[c.uid] || {}) }; delete tm[team];
  try { await S.db.doc("claims/" + c.uid).set({ teams: tm, updatedAt: Date.now() }); } catch (e) {}
}
function codesAdmin() {
  const L = S.lg[codeLg] || S.leagues[0];
  const rows = L.groups.flatMap(g => g.table.map(r => ({ key: r.slug, name: r.team, group: g })));
  const listText = () => rows.filter(r => S.codesPlain[r.key]).map(r => r.name + " (" + glabel(r.group) + "): " + fmtCode(S.codesPlain[r.key])).join("\n");
  const filter = () => { const q = codeQ.trim().toLowerCase(); document.querySelectorAll(".coderow").forEach(el => { el.hidden = !!q && !el.dataset.name.includes(q); }); };
  const box = h("section", { class: "panel codes" },
    h("p", { class: "muted", style: "margin:0" }, t("codesHint")),
    h("div", { class: "gpills wrapp" }, S.leagues.map(x => h("button", { type: "button", "aria-pressed": x === L ? "true" : "false", onclick: () => { codeLg = x.key; render(); } }, lgName(x.key)))),
    h("div", { class: "codetools" },
      h("input", { id: "codeSearch", type: "search", placeholder: t("searchTeam"), "aria-label": t("searchTeam"), value: codeQ, oninput: e => { codeQ = e.target.value; filter(); } }),
      h("button", { type: "button", class: "btn small", id: "genAllBtn", disabled: !!genBusy, onclick: () => genMissing(L) }, icon("shield"), genBusy === "all" ? t("generating") : t("genAll")),
      h("button", { type: "button", class: "btn ghost small", onclick: async e => { const b = e.currentTarget; try { await navigator.clipboard.writeText(listText()); b.textContent = t("copied"); } catch (er) {} } }, t("copyList"))),
    h("div", { class: "codelist" }, rows.map(r => h("div", { class: "coderow", "data-name": (r.name + " " + r.group.short).toLowerCase() },
      crest(r.key, r.name, "sm"), h("span", { class: "cname" }, r.name, h("small", {}, " · " + r.group.short)),
      S.claims[r.key] ? h("span", { class: "chip hot" }, icon("check"), t("claimed") + " " + fmtTime(S.claims[r.key].at))
        : S.codesPlain[r.key] ? h("code", {}, fmtCode(S.codesPlain[r.key])) : h("span", { class: "muted" }, t("defaultPw")),
      S.claims[r.key] ? h("button", { type: "button", class: "btn ghost small", onclick: () => resetClaim(r.key) }, t("resetPw")) : null,
      h("button", { type: "button", class: "btn ghost small", disabled: !!genBusy, onclick: () => genOne(r.key) }, genBusy === r.key ? t("generating") : S.codesPlain[r.key] ? t("newCode") : t("genCode"))))));
  setTimeout(filter, 0);
  return box;
}
function viewAdmin() {
  if (!S.owner) return [pageHero("", t("admin")), h("p", { class: "note" }, t("ownerOnly"))];
  return [pageHero("", t("admin")),
    h("div", { class: "seg", role: "tablist" }, [["queue", "queueTab"], ["codes", "teamCodes"]].map(([k, l]) =>
      h("button", { type: "button", role: "tab", "aria-selected": adminTab === k ? "true" : "false", onclick: () => { adminTab = k; render(); } }, t(l) + (k === "queue" && S.queue.length ? " (" + S.queue.length + ")" : "")))),
    adminTab === "codes" ? codesAdmin() : h("section", {},
      S.queue.length ? h("div", { class: "queue" }, S.queue.map(it => queueItem(it, true))) : h("div", { class: "empty" }, t("queueEmpty")))];
}

// ---------- shell ----------
function render() {
  document.documentElement.lang = lang; document.documentElement.dir = "ltr";
  document.querySelectorAll("[data-t]").forEach(el => el.textContent = t(el.dataset.t));
  document.querySelectorAll("[data-lang]").forEach(b => b.setAttribute("aria-pressed", b.dataset.lang === lang ? "true" : "false"));
  document.querySelectorAll(".adminOnly").forEach(el => el.hidden = !S.owner);
  document.querySelectorAll(".pendingBadge").forEach(el => { el.hidden = !S.queue.length; el.textContent = S.queue.length; });
  const hash = (location.hash || "#home").slice(1);
  const section = hash.startsWith("submit") || hash.startsWith("captain") ? "captain" : hash;
  document.querySelectorAll("[data-nav]").forEach(a => a.classList.toggle("on", a.dataset.nav === section));
  if (!S.data) return;
  const curTeam = hash.startsWith("t-") ? teamOf(hash.slice(2)) : null;
  const curGroup = hash.startsWith("g-") ? (S.data.groups.find(x => x.key === hash.slice(2)) || S.data.groups.find(x => x.key === "vet_" + hash.slice(2))) : null;
  const curLg = hash.startsWith("l-") ? S.lg[hash.slice(2)] : curGroup ? curGroup.lg : curTeam ? curTeam.lg : null;
  $("#groupbar").replaceChildren(...S.leagues.map(L => h("a", { href: "#l-" + L.key, class: curLg === L ? "on" : "" }, lgName(L.key))));
  $("#srcNote").textContent = t("source") + " " + S.data.updated;
  const f = $("#submitForm"); const keep = f ? { kind: f.kind.value, team: f.team.value, title: f.title.value, text: f.text.value, link: f.link.value, ...readMatch(f).raw } : null;
  let nodes;
  if (hash === "home") nodes = viewHome();
  else if (hash === "media") nodes = viewMedia();
  else if (hash === "admin") nodes = viewAdmin();
  else if (hash === "submit" || hash.startsWith("submit-")) { history.replaceState(null, "", "#captain"); nodes = viewCaptain(); }   // uploads only go through the Captains page
  else if (hash === "highlights") nodes = viewHighlights();
  else if (hash === "stats") nodes = viewStats();
  else if (hash.startsWith("captain")) nodes = viewCaptain();
  else if (hash.startsWith("l-")) nodes = curLg ? viewLeague(curLg) : null;
  else if (curGroup) nodes = viewGroup(curGroup);
  else if (curTeam) nodes = viewTeam(curTeam);
  if (!nodes) nodes = [pageHero("", "404"), h("p", { class: "note" }, t("notFound"))];
  const app = $("#app");
  const searchVal = $("#teamSearch") && $("#teamSearch").value;
  const codeVal = $("#codeInput") ? $("#codeInput").value : null;
  const csFocus = document.activeElement && document.activeElement.id === "codeSearch";
  const tf = $("#teamFind"), tfVal = tf ? tf.value : "", tfFocus = tf && document.activeElement === tf;
  app.classList.toggle("enter", animateNext); animateNext = false;
  app.replaceChildren(...nodes.flat().filter(Boolean));
  const ci = $("#codeInput"); if (ci) { if (codeVal) { ci.value = codeVal; if (ci.type === "search") ci.dispatchEvent(new Event("input")); } if (!ci.disabled) ci.focus(); }
  if (csFocus && $("#codeSearch")) $("#codeSearch").focus();
  const tf2 = $("#teamFind"); if (tf2 && tfVal) { tf2.value = tfVal; tf2.dispatchEvent(new Event("input")); } if (tf2 && tfFocus) tf2.focus();
  if (keep && $("#submitForm")) restore(keep);
  if (searchVal && $("#teamSearch")) { $("#teamSearch").value = searchVal; $("#teamSearch").dispatchEvent(new Event("input")); }
}
let lastHash = location.hash, animateNext = true;
window.addEventListener("hashchange", () => {
  animateNext = true;
  if (location.hash.startsWith("#g-") && lastHash !== location.hash) groupTab = "table";
  if (!location.hash.startsWith("#submit") && !location.hash.startsWith("#captain")) formMsg = null;
  applyCaptainHash();
  lastHash = location.hash; render(); window.scrollTo(0, 0);
});
document.querySelectorAll("[data-lang]").forEach(b => b.addEventListener("click", () => {
  lang = b.dataset.lang; try { localStorage.setItem("tribuna-lang", lang); } catch (e) {} render();
}));
loadData().then(() => { applyCaptainHash(); render(); }).catch(() => { $("#app").replaceChildren(h("p", { class: "note err" }, "data.json?")); });
initShared();
})();
</script>
